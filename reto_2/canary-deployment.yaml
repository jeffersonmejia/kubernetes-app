# Título: Deployment de la versión candidata (canary).
# Descripción: Este manifiesto define el grupo de pods que ejecuta la versión candidata de la aplicación y limita inicialmente su presencia a una réplica, frente a las cuatro réplicas estables. Las etiquetas identifican inequívocamente esta variante, mientras que APP_VERSION y APP_MESSAGE hacen que la aplicación informe que responde como v2-canary. Las comprobaciones de readiness y liveness consultan /health para que Kubernetes incorpore al tráfico solo pods disponibles y reinicie aquellos que dejen de responder correctamente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-app-reto2-canary
  labels:
    app: distributed-app-reto2
    track: canary
spec:
  # RETO 2: una sola réplica de la variante candidata para limitar su exposición inicial.
  replicas: 1
  selector:
    matchLabels:
      app: distributed-app-reto2
      track: canary
  template:
    metadata:
      labels:
        app: distributed-app-reto2
        track: canary
    spec:
      containers:
        - name: app
          image: docker.io/library/distributed-app-reto2:canary
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "v2-canary"
            - name: APP_MESSAGE
              value: "Versión canary: despliegue de prueba"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
