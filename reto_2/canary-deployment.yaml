apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-app-reto2-canary
  labels:
    app: distributed-app-reto2
    track: canary
spec:
  # RETO 2: una sola réplica de la variante candidata para limitar su exposición inicial.
  replicas: 1
  selector:
    matchLabels:
      app: distributed-app-reto2
      track: canary
  template:
    metadata:
      labels:
        app: distributed-app-reto2
        track: canary
    spec:
      containers:
        - name: app
          image: docker.io/library/distributed-app-reto2:canary
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "v2-canary"
            - name: APP_MESSAGE
              value: "Versión canary: despliegue de prueba"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
