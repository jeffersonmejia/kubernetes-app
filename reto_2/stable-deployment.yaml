# Título: Deployment de la versión estable.
# Descripción: En este código se observa que el Deployment conserva cuatro réplicas de la versión estable v1, identificadas con las etiquetas app=distributed-app-reto2 y track=stable. La imagen y las variables de entorno indican a la aplicación qué versión y mensaje debe mostrar; las etiquetas hacen posible que el Service compartido encuentre estos pods junto con los de la variante canary. Las comprobaciones readiness y liveness consultan /health para controlar disponibilidad y reiniciar contenedores que fallen. La cantidad de réplicas establece una proporción orientativa de cuatro pods estables por cada pod canary, no una garantía de tráfico por petición.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-app-reto2-stable
  labels:
    app: distributed-app-reto2
    track: stable
# INICIO DEL FRAGMENTO DEL DEPLOYMENT ESTABLE QUE SE DEBE COPIAR
spec:
  replicas: 4
  selector:
    matchLabels:
      app: distributed-app-reto2
      track: stable
  template:
    metadata:
      labels:
        app: distributed-app-reto2
        track: stable
    spec:
      containers:
        - name: app
          image: docker.io/library/distributed-app-reto2:stable
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "v1"
            - name: APP_MESSAGE
              value: "Versión estable: recibe la mayor parte del tráfico"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
# FIN DEL FRAGMENTO DEL DEPLOYMENT ESTABLE QUE SE DEBE COPIAR
