apiVersion: apps/v1
# RETO 1: el StatefulSet entrega a cada pod una identidad estable, por ejemplo distributed-app-0.
kind: StatefulSet
metadata:
  name: distributed-app
spec:
  # RETO 1: debe coincidir con metadata.name del Service headless.
  serviceName: distributed-app-peers
  replicas: 3
  selector:
    matchLabels:
      app: distributed-app
  template:
    metadata:
      labels:
        app: distributed-app
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: distributed-app
          # Construir esta etiqueta desde la carpeta reto_1 antes de aplicar el manifiesto.
          image: docker.io/library/distributed-app:reto1
          imagePullPolicy: Never
          ports:
            # RETO 1: el nombre "http" permite consultar registros SRV _http._tcp.
            - name: http
              containerPort: 3000
          env:
            # RETO 1: Downward API para que cada proceso conozca su propia identidad e IP.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # RETO 1: nombre DNS completo consultado periódicamente por index.js.
            - name: PEERS_DNS
              value: distributed-app-peers.$(POD_NAMESPACE).svc.cluster.local
            - name: PEERS_LOOKUP_INTERVAL_MS
              value: "5000"
          # La salud de la aplicación habilita sus registros DNS como endpoint listo.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
