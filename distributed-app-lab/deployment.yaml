apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: distributed-app
  template:
    metadata:
      labels:
        app: distributed-app
    spec:
      containers:
        - name: distributed-app
          image: distributed-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
